# Mises à jour automatiques (audit de sécurité du 24/10/2026).
# Site statique sans dépendances npm : seules les actions GitHub (Semgrep) sont suivies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      timezone: Europe/Paris
    cooldown:
      default-days: 7
    groups:
      actions-github:
        patterns: ["*"]
